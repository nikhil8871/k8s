apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-mgmt-deployment
  labels:
    app: resource-mgmt
spec:
  replicas: 2
  selector:
    matchLabels:
      name: r-pod
      type: frontend
  template:
    metadata:
      name: nginx-pod
      labels:
        name: r-pod
        type: frontend
    spec:
      containers:
      - name: nginx
        image: nginx
        resources:
          requests:
            memory: "1Gi"
            cpu: "1"
          limits:
            memory: "2Gi"
            cpu: "2"
      tolerations:
      - key: "black"
        operator: "Equal"
        value: "white"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "black"
                operator: "In"
                values:
                - "white"
                